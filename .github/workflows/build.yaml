name: build

# Called by ci: without release on every run, and with release after all tests of a tag passed. The
# caller gives the permissions.
on:
  workflow_call:
    inputs:
      release:
        description: Create the GitHub release
        type: boolean
        default: false

defaults:
  run:
    # unlike the default, it enables pipefail
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # to check that a tag is on master
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Check the version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" != tag ]]; then
            echo "version=dev-${GITHUB_SHA::7}" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The tag ${GITHUB_REF_NAME} is not a version such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::The tag ${GITHUB_REF_NAME} is not on master"
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >>"${GITHUB_OUTPUT}"
          # a pre-release is not marked as the latest release
          if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            echo "latest=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          set -x
          mkdir dist
          for arch in amd64 arm64; do
            mkdir -p "build/${arch}"
            GOARCH="${arch}" go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "build/${arch}/docker-wsl-proxy.exe" ./cmd/docker-wsl-proxy
            cp LICENSE "build/${arch}/"
            # named and laid out for mise's github backend: docker-wsl-proxy.exe at the root of the archive
            (cd "build/${arch}" && 7z a -bd "../../dist/docker-wsl-proxy-windows-${arch}.zip" docker-wsl-proxy.exe LICENSE)
          done
          build/amd64/docker-wsl-proxy.exe --version | grep -Fx "docker-wsl-proxy ${VERSION}"
          (cd dist && sha256sum -- * | tee checksums.txt)

      - name: Create the release
        if: inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          args=()
          if [[ "${LATEST}" != true ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes "${args[@]}" dist/*
